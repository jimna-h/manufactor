<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>MANUFACTOR</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MANUFACTOR">
<meta name="theme-color" content="#0c0e11">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Oswald:wght@300;400;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html{height:100%;}
body{
  font-family:'Oswald',sans-serif;
  background:#0c0e11;
  color:#e8e4dc;
  height:100dvh;
  display:flex;
  flex-direction:column;
  overflow:hidden;
  touch-action:manipulation;
  user-select:none;
}

/* ── TOP BAR ── */
.topbar{
  display:flex;
  align-items:center;
  padding:0 8px;
  height:44px;
  border-bottom:1px solid rgba(255,255,255,0.08);
  flex-shrink:0;
  gap:6px;
}
.topbar h1{
  font-family:'Cinzel',serif;
  font-size:0.9rem;
  letter-spacing:0.22em;
  font-weight:900;
  white-space:nowrap;
}
.create-row{
  display:flex;align-items:center;gap:5px;flex:1;justify-content:center;
}
.create-row select,
.create-row input{
  background:#1a1e24;border:1px solid rgba(255,255,255,0.14);
  border-radius:7px;color:#e8e4dc;font-family:'Oswald',sans-serif;
  font-size:0.85rem;padding:4px 7px;outline:none;height:32px;-webkit-appearance:none;
}
.create-row select{width:120px;}
.create-row input{width:46px;text-align:center;}
.create-row input::-webkit-inner-spin-button{-webkit-appearance:none;}
.btn-sm{
  height:32px;padding:0 10px;background:#1a1e24;
  border:1px solid rgba(255,255,255,0.18);border-radius:7px;
  color:#e8e4dc;font-family:'Cinzel',serif;font-size:0.58rem;
  letter-spacing:0.09em;cursor:pointer;white-space:nowrap;flex-shrink:0;
}
.btn-sm:active{background:#2a3040;}

/* untap-all always visible */
.btn-untap{
  height:32px;padding:0 10px;
  background:rgba(96,180,232,0.12);
  border:1px solid rgba(96,180,232,0.35);
  border-radius:7px;
  color:#60b4e8;font-family:'Cinzel',serif;font-size:0.58rem;
  letter-spacing:0.09em;cursor:pointer;white-space:nowrap;flex-shrink:0;
}
.btn-untap:active{background:rgba(96,180,232,0.25);}

.mod-indicator{display:flex;gap:3px;align-items:center;}
.mod-pip{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,0.1);}
.mod-pip.on{background:#e8b84b;}

/* ── TOKEN GRID ── */
.grid{
  flex:1;display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:5px;padding:5px;min-height:0;
}
@media(max-aspect-ratio:4/5){
  .grid{grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,1fr);}
}

/* ── TOKEN CARD ── */
.tok-card{
  background:#11141a;border:1.5px solid rgba(255,255,255,0.07);
  border-radius:11px;display:flex;flex-direction:column;
  overflow:hidden;position:relative;
}
.tok-card.lit{border-color:var(--c);}

.tok-label{
  display:flex;align-items:center;justify-content:center;gap:4px;
  padding:3px 5px 1px;font-family:'Cinzel',serif;font-size:0.55rem;
  letter-spacing:0.14em;color:rgba(255,255,255,0.28);flex-shrink:0;
}
.tok-card.lit .tok-label{color:var(--c);}
.tok-icon{font-size:0.8rem;line-height:1;}

/* big total */
.tok-total{
  text-align:center;font-size:clamp(2rem,5.5vw,5rem);
  font-weight:700;color:rgba(255,255,255,0.09);
  line-height:1;flex-shrink:0;padding:1px 0;
}
.tok-card.lit .tok-total{color:var(--c);}

/* sub-counts */
.tok-sub{
  display:flex;justify-content:center;gap:8px;
  padding:0 4px 2px;flex-shrink:0;
}
.sub-item{display:flex;flex-direction:column;align-items:center;}
.sub-val{font-size:clamp(0.7rem,1.6vw,1rem);font-weight:400;color:rgba(255,255,255,0.35);line-height:1.1;}
.sub-lbl{font-size:0.48rem;letter-spacing:0.07em;color:rgba(255,255,255,0.18);text-transform:uppercase;font-family:'Cinzel',serif;}
.tok-card.lit .sub-val{color:rgba(255,255,255,0.6);}
.tok-card.lit .sub-lbl{color:rgba(255,255,255,0.28);}

.tok-div{height:1px;background:rgba(255,255,255,0.06);flex-shrink:0;margin:0 6px;}

/* ── BUTTON ZONE ──
   Layout: 2 columns (ADD | REMOVE), 2 rows (UNTAPPED | TAPPED)
   Top-left:  ADD UNTAPPED   Top-right:  REMOVE UNTAPPED
   Bot-left:  ADD TAPPED     Bot-right:  REMOVE TAPPED
*/
.tok-btns{
  flex:1;display:grid;
  grid-template-columns:1fr 1fr;
  grid-template-rows:1fr 1fr;
  gap:3px;padding:3px;min-height:0;
}
.tbtn{
  border-radius:7px;border:none;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  gap:1px;cursor:pointer;min-height:28px;
}
.tbtn:active{opacity:0.55;transform:scale(0.92);}

.tbtn-sym{
  font-family:'Oswald',sans-serif;
  font-size:clamp(0.9rem,2.2vw,1.7rem);
  font-weight:700;line-height:1;
}
.tbtn-lbl{
  font-size:clamp(0.38rem,0.9vw,0.55rem);
  letter-spacing:0.05em;line-height:1;font-family:'Cinzel',serif;
  white-space:nowrap;
}

/* ADD column = green-tinted */
.tbtn.add-un{
  background:rgba(100,210,100,0.1);
}
.tbtn.add-un .tbtn-sym{color:rgba(140,230,130,0.75);}
.tbtn.add-un .tbtn-lbl{color:rgba(140,230,130,0.45);}
.tbtn.add-ta{
  background:rgba(100,210,100,0.06);
}
.tbtn.add-ta .tbtn-sym{color:rgba(140,230,130,0.55);}
.tbtn.add-ta .tbtn-lbl{color:rgba(140,230,130,0.35);}

/* REMOVE column = red-tinted */
.tbtn.rem-un{
  background:rgba(220,90,80,0.09);
}
.tbtn.rem-un .tbtn-sym{color:rgba(230,120,110,0.7);}
.tbtn.rem-un .tbtn-lbl{color:rgba(230,120,110,0.4);}
.tbtn.rem-ta{
  background:rgba(220,90,80,0.06);
}
.tbtn.rem-ta .tbtn-sym{color:rgba(230,120,110,0.55);}
.tbtn.rem-ta .tbtn-lbl{color:rgba(230,120,110,0.35);}

/* lit-card brightens buttons slightly */
.tok-card.lit .tbtn.add-un{background:color-mix(in srgb,var(--c) 14%,rgba(80,200,80,0.1));}
.tok-card.lit .tbtn.add-ta{background:color-mix(in srgb,var(--c) 8%,rgba(80,200,80,0.07));}

/* tap row */
.tok-taprow{
  display:flex;gap:3px;padding:0 3px 3px;flex-shrink:0;
}
.ttap{
  flex:1;height:22px;border-radius:5px;
  border:1px solid rgba(255,255,255,0.07);
  background:rgba(255,255,255,0.03);
  color:rgba(255,255,255,0.3);font-family:'Cinzel',serif;
  font-size:0.48rem;letter-spacing:0.07em;cursor:pointer;
}
.ttap:active{background:rgba(255,255,255,0.1);}

/* flash */
@keyframes flashpulse{0%{opacity:0.32;}100%{opacity:0;}}
.flash-overlay{
  position:absolute;inset:0;border-radius:9px;
  background:var(--c,#fff);opacity:0;pointer-events:none;
  animation:flashpulse 0.32s ease-out forwards;
}

/* ── DRAWER ── */
.drawer-backdrop{
  position:fixed;inset:0;background:rgba(0,0,0,0.72);
  z-index:50;opacity:0;pointer-events:none;transition:opacity 0.2s;
}
.drawer-backdrop.open{opacity:1;pointer-events:auto;}
.drawer{
  position:fixed;bottom:0;left:0;right:0;background:#12151b;
  border-top:1px solid rgba(255,255,255,0.1);border-radius:16px 16px 0 0;
  z-index:51;padding:10px 10px 28px;
  transform:translateY(100%);
  transition:transform 0.25s cubic-bezier(0.32,0.72,0,1);
  max-height:88dvh;overflow-y:auto;
}
.drawer.open{transform:translateY(0);}
.drawer-handle{width:36px;height:4px;background:rgba(255,255,255,0.16);border-radius:2px;margin:0 auto 12px;}
.drawer h2{
  font-family:'Cinzel',serif;font-size:0.65rem;letter-spacing:0.2em;
  color:rgba(255,255,255,0.32);text-align:center;margin-bottom:10px;
}
.mods-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px;}

/* mod tile with card art */
.mod-tile{
  background:#1a1e26;border:1.5px solid rgba(255,255,255,0.07);
  border-radius:10px;cursor:pointer;overflow:hidden;position:relative;
  display:flex;flex-direction:column;
}
.mod-tile.on{border-color:var(--mc);}
.mod-tile.on::after{
  content:'';position:absolute;inset:0;
  background:var(--mc);opacity:0.08;pointer-events:none;
}
/* card art image fills top portion */
.mod-art{
  width:100%;aspect-ratio:7/5;object-fit:cover;object-position:center top;
  display:block;background:#1a1e26;opacity:0.55;transition:opacity 0.15s;
  /* placeholder color while image absent */
  min-height:60px;
}
.mod-tile.on .mod-art{opacity:1;}
/* overlay strip at bottom of art for name */
.mod-art-wrap{position:relative;flex-shrink:0;}
.mod-art-label{
  position:absolute;bottom:0;left:0;right:0;
  padding:14px 7px 5px;
  background:linear-gradient(transparent,rgba(10,12,15,0.92));
  font-family:'Cinzel',serif;font-size:0.6rem;letter-spacing:0.07em;
  color:rgba(255,255,255,0.5);line-height:1.25;
}
.mod-tile.on .mod-art-label{color:#e8e4dc;}
.mod-bottom{
  display:flex;align-items:center;justify-content:space-between;
  padding:5px 8px 6px;
}
.mod-dot{
  width:8px;height:8px;border-radius:50%;
  background:rgba(255,255,255,0.1);flex-shrink:0;
}
.mod-tile.on .mod-dot{background:var(--mc);}
.mod-badge{
  font-size:0.55rem;font-family:'Cinzel',serif;letter-spacing:0.07em;
  border-radius:4px;padding:2px 6px;border:1px solid var(--mc);
  color:var(--mc);opacity:0.4;
}
.mod-tile.on .mod-badge{opacity:1;}

.drawer-actions{display:flex;gap:7px;margin-top:12px;}
.dbtn{
  flex:1;height:40px;border-radius:8px;border:1px solid rgba(255,255,255,0.12);
  background:rgba(255,255,255,0.04);color:rgba(255,255,255,0.5);
  font-family:'Cinzel',serif;font-size:0.58rem;letter-spacing:0.1em;cursor:pointer;
}
.dbtn:active{opacity:0.7;}
</style>
</head>
<body>

<div class="topbar">
  <h1>MANUFACTOR</h1>
  <div class="create-row">
    <select id="createType">
      <option value="clue">Clue</option>
      <option value="food">Food</option>
      <option value="treasure">Treasure</option>
      <option value="mutagen">Mutagen</option>
      <option value="map">Map</option>
    </select>
    <input type="number" id="createAmt" value="1" min="1" max="99">
    <button class="btn-sm" onclick="createTokens()">CREATE</button>
  </div>
  <button class="btn-untap" onclick="untapAll()">☀ UNTAP</button>
  <button class="btn-sm" onclick="openDrawer()" style="display:flex;align-items:center;gap:5px;">
    <span>MODS</span>
    <div class="mod-indicator" id="modPips"></div>
  </button>
</div>

<div class="grid" id="tokenGrid"></div>

<div class="drawer-backdrop" id="backdrop" onclick="closeDrawer()"></div>
<div class="drawer" id="drawer">
  <div class="drawer-handle"></div>
  <h2>ACTIVE MODIFIERS</h2>
  <div class="mods-grid" id="modsGrid"></div>
  <div class="drawer-actions">
    <button class="dbtn" onclick="resetAll();closeDrawer()">RESET ALL</button>
    <button class="dbtn" onclick="closeDrawer()">CLOSE</button>
  </div>
</div>

<script>
var TT=['clue','food','treasure','mutagen','map'];
var META={
  clue:     {label:'Clues',   icon:'🔍',c:'#60b4e8',isArt:true},
  food:     {label:'Food',    icon:'🍎',c:'#7ecb6f',isArt:true},
  treasure: {label:'Treasure',icon:'💎',c:'#e8b84b',isArt:true},
  mutagen:  {label:'Mutagen', icon:'🧪',c:'#b87ee8',isArt:false},
  map:      {label:'Maps',    icon:'🗺',c:'#e87860',isArt:true},
};
var MODS=[
  {id:'adrix',     name:'Adrix & Nev',          badge:'×2',      mc:'#7ec8e8', img:'img/adrix-and-nev-twincasters.jpg'},
  {id:'manufactor',name:'Academy Manufactor',   badge:'REPLACE', mc:'#e8d060', img:'img/academy-manufactor.jpg'},
  {id:'peregrin',  name:'Peregrin Took',         badge:'+FOOD',   mc:'#7ecb6f', img:'img/peregrin-took.jpg'},
  {id:'vending',   name:'Nuka-Cola Vending',     badge:'TRIGGER', mc:'#e8b84b', img:'img/nuka-cola-vending-machine.jpg'},
  {id:'donatello', name:'Donatello, the Brains', badge:'+MUTAGEN',mc:'#b87ee8', img:'img/donatello-the-brains.jpg'},
  {id:'mondrak',   name:'Mondrak, Glory Dominus',badge:'×2',      mc:'#e8a0c0', img:'img/mondrak-glory-dominus.jpg'},
  {id:'helm',      name:'Worldwalker Helm',      badge:'+MAP',    mc:'#e87860', img:'img/worldwalker-helm.jpg'},
];
var modOn={};
MODS.forEach(function(m){modOn[m.id]=false;});
var state={};
TT.forEach(function(t){state[t]={u:0,ta:0};});

function runCreate(tokens,fromSac){
  fromSac=fromSac||false;
  var tapped=tokens.every(function(t){return t.tapped;});
  var batch=tokens.map(function(t){return {type:t.type,tapped:t.tapped,src:t.src};});
  if(!fromSac){
    var hasArt=batch.some(function(t){return META[t.type]&&META[t.type].isArt;});
    if(modOn.peregrin)  batch.push({type:'food',   tapped:tapped,src:'p'});
    if(modOn.donatello) batch.push({type:'mutagen',tapped:tapped,src:'d'});
    if(modOn.helm&&hasArt) batch.push({type:'map', tapped:tapped,src:'h'});
  }
  if(modOn.manufactor){
    var ex=[];
    batch.forEach(function(tok){
      if(tok.type==='clue'||tok.type==='food'||tok.type==='treasure'){
        ex.push({type:'clue',    tapped:tok.tapped,src:'mf'});
        ex.push({type:'food',    tapped:tok.tapped,src:'mf'});
        ex.push({type:'treasure',tapped:tok.tapped,src:'mf'});
      } else {ex.push(tok);}
    });
    batch=ex;
  }
  var mul=1;
  if(modOn.adrix)   mul*=2;
  if(modOn.mondrak) mul*=2;
  if(mul>1){
    var copies=[];
    for(var i=1;i<mul;i++) batch.forEach(function(tok){copies.push({type:tok.type,tapped:tok.tapped,src:'mul'});});
    batch=batch.concat(copies);
  }
  batch.forEach(function(tok){state[tok.type][tok.tapped?'ta':'u']++;});
}

function createTokens(){
  var type=document.getElementById('createType').value;
  var amt=Math.max(1,parseInt(document.getElementById('createAmt').value)||1);
  var prev=snapshot();
  runCreate(Array.from({length:amt},function(){return {type:type,tapped:false,src:'m'};}));
  render();flashChanged(prev);
}

function adj(type,sk,d){
  if(d>0){
    var prev=snapshot();
    runCreate([{type:type,tapped:sk==='ta',src:'m'}]);
    render();flashChanged(prev);
  } else {
    if(state[type][sk]>0){
      state[type][sk]--;
      if(type==='food'&&modOn.vending){
        var prev2=snapshot();
        runCreate([{type:'treasure',tapped:true,src:'v'}],true);
        flashChanged(prev2);
      }
    }
    render();
  }
}

function snapshot(){return TT.map(function(t){return state[t].u+state[t].ta;});}
function flashChanged(prev){TT.forEach(function(t,i){if(state[t].u+state[t].ta>prev[i])flash(t);});}

function tapOne(type){if(state[type].u>0){state[type].u--;state[type].ta++;render();}}
function untapOne(type){if(state[type].ta>0){state[type].ta--;state[type].u++;render();}}
function untapAll(){TT.forEach(function(t){state[t].u+=state[t].ta;state[t].ta=0;});render();}
function resetAll(){
  TT.forEach(function(t){state[t].u=0;state[t].ta=0;});
  MODS.forEach(function(m){modOn[m.id]=false;});
  renderMods();render();
}

function flash(type){
  var card=document.getElementById('tc-'+type);
  if(!card)return;
  var o=document.createElement('div');
  o.className='flash-overlay';
  o.style.setProperty('--c',META[type].c);
  card.appendChild(o);
  o.addEventListener('animationend',function(){o.remove();});
}

function render(){
  TT.forEach(function(type){
    var s=state[type];var total=s.u+s.ta;
    var card=document.getElementById('tc-'+type);if(!card)return;
    card.className='tok-card'+(total>0?' lit':'');
    card.querySelector('.tok-total').textContent=total;
    card.querySelector('.sub-u').textContent=s.u;
    card.querySelector('.sub-ta').textContent=s.ta;
  });
  var pips=document.getElementById('modPips');pips.innerHTML='';
  MODS.forEach(function(m){
    var d=document.createElement('div');
    d.className='mod-pip'+(modOn[m.id]?' on':'');
    pips.appendChild(d);
  });
}

function buildGrid(){
  var grid=document.getElementById('tokenGrid');grid.innerHTML='';
  TT.forEach(function(type){
    var m=META[type];
    var card=document.createElement('div');
    card.className='tok-card';card.id='tc-'+type;
    card.style.setProperty('--c',m.c);
    card.innerHTML=
      '<div class="tok-label"><span class="tok-icon">'+m.icon+'</span>'+m.label.toUpperCase()+'</div>'+
      '<div class="tok-total">0</div>'+
      '<div class="tok-sub">'+
        '<div class="sub-item"><div class="sub-val sub-u">0</div><div class="sub-lbl">untap</div></div>'+
        '<div class="sub-item"><div class="sub-val sub-ta">0</div><div class="sub-lbl">tapped</div></div>'+
      '</div>'+
      '<div class="tok-div"></div>'+
      '<div class="tok-btns">'+
        '<button class="tbtn add-un"  onclick="adj(\''+type+'\',\'u\',1)">'+
          '<span class="tbtn-sym">+</span><span class="tbtn-lbl">ADD UNTAPPED</span></button>'+
        '<button class="tbtn rem-un" onclick="adj(\''+type+'\',\'u\',-1)">'+
          '<span class="tbtn-sym">−</span><span class="tbtn-lbl">REM UNTAPPED</span></button>'+
        '<button class="tbtn add-ta"  onclick="adj(\''+type+'\',\'ta\',1)">'+
          '<span class="tbtn-sym">+</span><span class="tbtn-lbl">ADD TAPPED</span></button>'+
        '<button class="tbtn rem-ta" onclick="adj(\''+type+'\',\'ta\',-1)">'+
          '<span class="tbtn-sym">−</span><span class="tbtn-lbl">REM TAPPED</span></button>'+
      '</div>'+
      '<div class="tok-taprow">'+
        '<button class="ttap" onclick="tapOne(\''+type+'\')">TAP ALL</button>'+
        '<button class="ttap" onclick="untapOne(\''+type+'\')">UNTAP ALL</button>'+
      '</div>';
    grid.appendChild(card);
  });
}

function renderMods(){
  var grid=document.getElementById('modsGrid');grid.innerHTML='';
  MODS.forEach(function(mod){
    var on=modOn[mod.id];
    var tile=document.createElement('div');
    tile.className='mod-tile'+(on?' on':'');
    tile.style.setProperty('--mc',mod.mc);
    tile.innerHTML=
      '<div class="mod-art-wrap">'+
        '<img class="mod-art" src="'+mod.img+'" alt="'+mod.name+'" onerror="this.style.background=\'#1e2330\'">'+
        '<div class="mod-art-label">'+mod.name+'</div>'+
      '</div>'+
      '<div class="mod-bottom">'+
        '<div class="mod-dot"></div>'+
        '<div class="mod-badge">'+mod.badge+'</div>'+
      '</div>';
    tile.onclick=function(){modOn[mod.id]=!modOn[mod.id];renderMods();render();};
    grid.appendChild(tile);
  });
}

function openDrawer(){
  document.getElementById('backdrop').classList.add('open');
  document.getElementById('drawer').classList.add('open');
}
function closeDrawer(){
  document.getElementById('backdrop').classList.remove('open');
  document.getElementById('drawer').classList.remove('open');
}

buildGrid();renderMods();render();
</script>
</body>
</html>
